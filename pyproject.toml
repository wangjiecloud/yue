[project]
name = "yue-backend"
version = "0.1.0"
description = "Yue family offline interactive learning system - generation backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
yue-probe = "yue_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/yue_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "scripts", "tests"]
exclude = [".venv", ".venv-cosyvoice", "third_party", "data", "mobile", "studio", "schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
